questions:
  - id: "INRS-DEV-001"
    category: "valid"
    question: "Quand je dois consigner une machine, quelles sont les 4 grandes étapes à respecter ?"
    original_question: "Quelles sont les quatre phases générales d'une procédure de consignation pour une énergie donnée ?"
    must_refuse: false
    target_document_id: "inrs-ed6109"
    expected_section: "4.1. Procédures"
    expected_page: 11
    exact_quote: "a) séparation; b) condamnation et signalisation; c) dissipation ou rétention/confinement; d) vérification et identification."
    expected_identifiers: []
    reason: "Teste la recherche et l'extraction d'une liste séquentielle générale à 4 phases."

  - id: "INRS-DEV-002"

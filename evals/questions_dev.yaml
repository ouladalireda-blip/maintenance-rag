  - id: "INRS-DEV-006"
    category: "valid"
    question: "Quel article du Code du travail définit les substances et mélanges dangereux en référence au règlement CLP ?"
    must_refuse: false
    target_document_id: "inrs-ed6109"
    expected_section: "6.1. Consignation fluidique"
    expected_page: 20
    exact_quote: "L'article R. 4411-6 du Code du travail définit les substances et mélanges dangereux en faisant référence au règlement européen n° 1272/2008."

# =====================================================================
# Manifeste du corpus : une entrée par document source.
# id : identifiant stable du document, stocké tel quel dans documents.slug (base Supabase).
# page_offset : page imprimée = page PDF − page_offset (stocké dans documents.page_offset).
# sha256 : empreinte du fichier exact indexé (null tant que le fichier est absent).
# layout_profile : profil de mise en page (config/config.yaml → layout_profiles).
# exclude_pages : pages PDF non indexées (couverture, mentions, sommaire, dos…).
# =====================================================================

documents:
  - id: inrs-ed6109          # = documents.slug
    title: "INRS ED 6109 — Consignations et déconsignations"
    path: corpus/inrs/ed6109.pdf
    language: fr
    machine: null
    version: "octobre 2020"
    license: "© INRS 2020 — reproduction interdite sans consentement : usage local uniquement, non versionné"
    source_url: "à compléter : URL officielle sur inrs.fr"
    page_offset: 2
    sha256: "77e164b01354b66e1f6cba4735e450dc928594373647a1dba734ba0bab992574"   # fichier absent de corpus/inrs/ lors de l'audit : à calculer (voir docs/corpus.md)
    layout_profile: inrs       # config/config.yaml → layout_profiles.inrs
    # Pages PDF non indexées : couverture (1), mentions légales (2), page de titre (3),
    # contributeurs (4), sommaire (5), pages blanches (6, 8, 32), dos (34, 35).
    # La bibliographie (33) est conservée.
    exclude_pages: [1, 2, 3, 4, 5, 6, 8, 32, 34, 35]


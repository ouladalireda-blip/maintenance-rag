# =====================================================================
# Manifeste du corpus : une entrée par document source.
# id : identifiant stable du document, stocké tel quel dans documents.slug (base Supabase).
# page_offset : page imprimée = page PDF − page_offset (stocké dans documents.page_offset).
# sha256 : empreinte du fichier exact indexé (null tant que le fichier est absent).
# =====================================================================

documents:
  - id: inrs-ed6109          # = documents.slug
    title: "INRS ED 6109 — Consignations et déconsignations"
    path: corpus/inrs/ed6109.pdf
    language: fr
    machine: null
    version: "octobre 2020"
    license: "© INRS 2020 — reproduction interdite sans consentement : usage local uniquement, non versionné"
    source_url: "à compléter : URL officielle sur inrs.fr"
    page_offset: 2
    sha256: null   # fichier absent de corpus/inrs/ lors de l'audit : à calculer (voir docs/corpus.md)


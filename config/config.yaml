# =====================================================================
# Configuration de maintenance-rag — valeurs de départ.
# Les secrets ne sont JAMAIS ici : ils viennent de .env (voir .env.example).
# =====================================================================

embeddings:
  provider: openai                  # fournisseur des vecteurs
  model: text-embedding-3-small     # modèle multilingue, économique
  dimensions: 1536                  # DOIT égaler vector(1536) dans supabase/migrations/0001_init.sql
  batch_size: 100                   # textes par appel à l'API d'embedding
  max_attempts: 3                   # essais par lot (attente exponentielle : 1 s, 2 s)

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0
  max_output_tokens: 2000
  price_per_1m_input: 0.15
  price_per_1m_output: 0.60

generation:
  top_k: 8                          # passages transmis au LLM (R@8 = 0,97 sur le jeu dev)

retrieval:
  match_count: 20
  rrf_k: 50                         # constante de lissage de la fusion RRF
  weights:
    semantic: 1.0
    full_text: 0.0     # désactivé par la grille du 10/11 (bruit : "consign" dans 56/69 chunks) ; réactivable
    identifier: 2.0
rerank:
  enabled: false                    # retiré du pipeline : docs/adr/0002-retrait-reranker-flashrank.md
  provider: flashrank               # cross-encoder local, sans appel réseau
  model: "ms-marco-MultiBERT-L-12"  # multilingue (BERT multilingue, 100+ langues) ; recalibrer tau si changé
  top_n: 3                          # inutilisé depuis l'ADR 0002 ; voir generation.top_k
  cache_dir: ".cache/flashrank"     # modèle FlashRank local (relatif à la racine, non versionné)
  max_length: 512                   # tokens question + passage, au-delà le reranker tronque

guardrails:
  # Garde-fou 1 (seuil tau sur un score avant génération) suspendu : ni le reranker ni la
  # similarité ne séparent les pièges (docs/adr/0002-retrait-reranker-flashrank.md).
  # Le refus repose sur le LLM (info_presente) et le garde-fou 2 (vérification des citations).
  min_quote_chars: 20               # longueur minimale (normalisée) d'une citation vérifiable

api:
  daily_budget_usd: 1.0             # coût LLM cumulé par jour (date locale du serveur) ; au-delà : 429
  cors_origins:                     # origines autorisées de l'interface (CORS)
    - "http://localhost:5173"
  log_path: "data/api_log.sqlite"   # journal local (gitignoré) : ni réponse ni extrait du guide

ui:
  timeout_s: 60                     # délai d'attente d'une réponse de l'API (génération : ~2 à 5 s)
  history_size: 5                   # questions de la session gardées dans l'historique
  examples:                         # exemples cliquables : jeu DEV uniquement (jamais le jeu test)
    - "INRS-DEV-007"                # valide
    - "INRS-DEV-028"                # valide
    - "INRS-DEV-037"                # piège (near_miss)
    - "INRS-DEV-041"                # piège (near_miss)

chunking:
  max_tokens: 350                   # mesuré : 0 passage > 512 tokens BERT avec marge pour la question
  never_split_lists: true           # une liste d'étapes (procédure) n'est jamais coupée

# ---------------------------------------------------------------------
# Profils de mise en page des PDF (src/maintenance_rag/pdf_reader.py).
# Signatures (taille en pt, couleur RRGGBB, gras) relevées avec scripts/inspect_pdf.py
# sur l'ED 6109 entière ; la police n'est pas comparée. Distances en points PDF.
# ---------------------------------------------------------------------
layout_profiles:
  inrs:
    chapter:                        # chapitre numéroté (20 pt) ; chapitre non numéroté (30 pt)
      - {size: 20.0, color: "498ca7", bold: true}
      - {size: 30.0, color: "498ca7", bold: true}
    section:                        # titre numéroté N.N.
      - {size: 14.0, color: "799a2c", bold: true}
    subsection:                     # titre numéroté N.N.N.
      - {size: 12.0, color: "356d83", bold: true}
    intertitle:                     # intertitre (souvent précédé d'un triangle dessiné) ; termes du glossaire
      - {size: 11.0, color: "799a2c", bold: true}
    warning:                        # « Attention ! » en rouge
      - {size: 11.0, color: "d3232a", bold: true}
    caption:                        # titre de photo (12 pt gras noir) ; commentaire de photo (9 pt)
      - {size: 12.0, color: "000000", bold: true}
      - {size: 9.0, color: "000000", bold: false}
    page_number:                    # numéro imprimé, dans la marge latérale
      - {size: 11.0, color: "498ca7", bold: true}
    size_tolerance: 0.3
    color_tolerance: 8
    warning_prefix: "Attention"
    glossary_chapter: "Définitions"
    margin_ratio: 0.12              # bande latérale (fraction de la largeur) des numéros de page
    column_tolerance: 10.0          # marge autour du milieu de la zone de texte
    min_lines_per_column: 3         # en dessous, page à une seule colonne
    paragraph_gap_margin: 1.5       # nouveau paragraphe si écart > interligne médian + marge
    short_line_margin: 15.0         # ligne « courte » : s'arrête à plus de 15 pt du bord droit
    list_indent: 2.0                # retrait minimal d'une ligne de continuation de puce
    note_max_size: 8.5              # notes de bas de page : 8 pt…
    note_min_y_ratio: 0.75          # … dans le dernier quart de la page
    frame_min_width: 40.0           # encadré : rectangle plein sans contour d'au moins 40 × 15 pt
    frame_min_height: 15.0
    arrow_max_size: 12.0            # triangle d'intertitre : petit polygone plein…
    arrow_max_distance: 12.0        # … à moins de 12 pt du début de la ligne
    diagram_merge_distance: 40.0    # schéma : regroupement des tracés (courbes, cadres) proches…
    diagram_min_items: 3            # … d'au moins 3 tracés ; le texte qu'il contient est ignoré
    caption_max_gap: 12.0           # légende : texte collé (≤ 12 pt) au-dessus ou au-dessous d'une photo

# =====================================================================
# Configuration de maintenance-rag — valeurs de départ.
# Les secrets ne sont JAMAIS ici : ils viennent de .env (voir .env.example).
# =====================================================================

embeddings:
  provider: openai                  # fournisseur des vecteurs
  model: text-embedding-3-small     # modèle multilingue, économique
  dimensions: 1536                  # DOIT égaler vector(1536) dans supabase/migrations/0001_init.sql

llm:
  provider: anthropic               # fournisseur du modèle de génération
  model: "à choisir : modèle récent et économique"  # à fixer avant la première évaluation
  temperature: 0                    # déterministe : reproductibilité des évaluations

retrieval:
  match_count: 10                   # nombre de candidats renvoyés par hybrid_search
  rrf_k: 50                         # constante de lissage de la fusion RRF
  semantic_weight: 1.0              # poids du classement vectoriel
  full_text_weight: 1.0             # poids du classement plein texte
  identifier_weight: 2.0            # poids des références exactes (une référence exacte prime)

rerank:
  provider: flashrank               # cross-encoder local, sans appel réseau
  model: "ms-marco-MultiBERT-L-12"  # multilingue (BERT multilingue, 100+ langues) ; recalibrer tau si changé
  top_n: 3                          # passages transmis au LLM après reranking

guardrails:
  # Seuil du garde-fou 1 (score de reranking minimal pour répondre).
  # null tant que tau n'est pas calibré sur evals/questions_dev.yaml : aucune valeur
  # arbitraire ne doit décider des refus. Une fois calibré, il est FIGÉ avant toute
  # mesure sur questions_test.yaml (sinon le jeu de test fuit dans le réglage).
  tau: null

chunking:
  max_tokens: 500                   # taille maximale d'un passage
  never_split_lists: true           # une liste d'étapes (procédure) n'est jamais coupée

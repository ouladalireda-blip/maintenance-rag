[project]
name = "maintenance-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reda Oulad Ali", email = "ouladalireda@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.7.0",
    "fastapi>=0.162.2",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "openai>=3.48.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
ui = [
    "streamlit>=1.67.0",
]

# ---------------------------------------------------------------------
# Outillage qualité
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["maintenance_rag"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
